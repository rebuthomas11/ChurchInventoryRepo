<div class="login-page">

  <div class="login-card">

    <!-- Header -->
    <div class="login-header">

      <div class="header-icon">
        <mat-icon>inventory_2</mat-icon>
      </div>

      <div>
        <h1>Church Inventory</h1>
        <p>Inventory Management System</p>
      </div>

    </div>


    <!-- Login Content -->
    <div class="login-content">

      <h2>Welcome Back</h2>

      <p class="login-subtitle">
        Sign in to manage your church inventory
      </p>


      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <!-- Username -->
  <mat-form-field appearance="outline" class="w-100">

  <mat-label>Login Name</mat-label>

  <mat-icon matPrefix>
    person
  </mat-icon>

  <input
    matInput
    type="text"
    formControlName="loginName"
    placeholder="Enter login name"
    [errorStateMatcher]="matcher">

  <mat-error *ngIf="loginName?.hasError('required')">
    Login name is required
  </mat-error>

</mat-form-field>


        <!-- Password -->
        <mat-form-field appearance="outline" class="w-100">

          <mat-label>Password</mat-label>

          <mat-icon matPrefix>lock</mat-icon>

          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="loginPassword"
            placeholder="Enter password">

          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword">

            <mat-icon>
              {{ hidePassword ? 'visibility' : 'visibility_off' }}
            </mat-icon>

          </button>

          <mat-error *ngIf="loginPassword?.hasError('required')">
            Password is required
          </mat-error>

        </mat-form-field>


        <!-- Remember / Forgot -->
        <div class="login-options">

          <mat-checkbox formControlName="rememberMe">
            Remember me
          </mat-checkbox>

          <a href="javascript:void(0)">
            Forgot Password?
          </a>

        </div>


        <!-- Login Button -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-button"
          [disabled]="isLoading">

          <mat-icon>login</mat-icon>

          <mat-spinner
    *ngIf="isLoading"
    diameter="20">
  </mat-spinner>

  <span>
    {{ isLoading ? 'Signing in...' : 'Login' }}
  </span>

        </button>

      </form>

    </div>


    <!-- Footer -->
    <div class="login-footer">

      <mat-icon>church</mat-icon>

      <span>Church Inventory Management</span>

    </div>

  </div>

</div>
