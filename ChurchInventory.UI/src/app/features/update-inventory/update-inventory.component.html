<h2 mat-dialog-title>
  Edit Inventory Item
</h2>

<mat-dialog-content>

  <form [formGroup]="inventoryForm">

    <mat-form-field appearance="outline">
      <mat-label>Item Name</mat-label>
      <input matInput formControlName="itemName">

      <mat-error *ngIf="inventoryForm.get('itemName')?.hasError('required')">
        Item name is required
      </mat-error>
    </mat-form-field>


    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>

      <mat-select formControlName="itemCategory">
        <mat-option
          *ngFor="let category of categories"
          [value]="category">
          {{ category }}
        </mat-option>
      </mat-select>

    </mat-form-field>


    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>

      <textarea
        matInput
        rows="3"
        formControlName="itemDescription">
      </textarea>

    </mat-form-field>


    <div class="two-column">

      <mat-form-field appearance="outline">
        <mat-label>Quantity</mat-label>
        <input
          matInput
          type="number"
          formControlName="quantity">
      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>Unit</mat-label>

        <mat-select formControlName="unit">
          <mat-option
            *ngFor="let unit of units"
            [value]="unit">
            {{ unit }}
          </mat-option>
        </mat-select>

      </mat-form-field>

    </div>


    <div class="two-column">

      <mat-form-field appearance="outline">
        <mat-label>Minimum Stock</mat-label>

        <input
          matInput
          type="number"
          formControlName="minimumStock">

      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>Location</mat-label>

        <input
          matInput
          formControlName="location">

      </mat-form-field>

    </div>


   <mat-form-field appearance="outline">
  <mat-label>Purchase Date</mat-label>

  <input
    matInput
    [matDatepicker]="purchasePicker"
    formControlName="purchaseDate"
    (dateChange)="onPurchaseDateChange($event)">

  <mat-datepicker-toggle
    matSuffix
    [for]="purchasePicker">
  </mat-datepicker-toggle>

  <mat-datepicker #purchasePicker></mat-datepicker>
</mat-form-field>

  </form>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    (click)="cancel()">
    Cancel
  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="update()">
    Update
  </button>

</mat-dialog-actions>
