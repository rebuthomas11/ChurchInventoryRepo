<div class="dashboard-header w-100" style="border-radius: 0;">

    <div class="header-content">

    <div class="header-icon">
      <mat-icon>inventory_2</mat-icon>
    </div>

    <div>
      <h1>Church Inventory</h1>
      <p>Edit inventory details</p>
    </div>

  </div>

  <div class="header-subtitle">
    <mat-icon>edit</mat-icon>
    <span>Inventory Edit</span>
  </div>

</div>

<mat-dialog-content>

  <form [formGroup]="inventoryForm" >
<div class="row">
  <div class="col-md-6">
<mat-form-field appearance="outline">
      <mat-label>Item Name</mat-label>
      <input matInput formControlName="itemName">

      <mat-error *ngIf="inventoryForm.get('itemName')?.hasError('required')">
        Item name is required
      </mat-error>
    </mat-form-field>
  </div>
  <div class="col-md-6">
     <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>

      <mat-select formControlName="itemCategory">
        <mat-option
          *ngFor="let category of categories"
          [value]="category">
          {{ category }}
        </mat-option>
      </mat-select>

    </mat-form-field>
  </div>
</div>
    
<div class="row">
  <div class="col-md-12">

    <mat-form-field appearance="outline" class="w-75">
      <mat-label>Description</mat-label>

      <textarea
        matInput
        rows="3"
        formControlName="itemDescription">
      </textarea>

    </mat-form-field>
</div>
</div>

   <div class="row">
  <div class="col-md-6">
      <mat-form-field appearance="outline">
        <mat-label>Quantity</mat-label>
        <input
          matInput
          type="number"
          formControlName="quantity">
      </mat-form-field>
</div>
<div class="col-md-6">
      <mat-form-field appearance="outline">
        <mat-label>Unit</mat-label>

        <mat-select formControlName="unit">
          <mat-option
            *ngFor="let unit of units"
            [value]="unit">
            {{ unit }}
          </mat-option>
        </mat-select>

      </mat-form-field>
</div>
    </div>


      <div class="row">
  <div class="col-md-6">

      <mat-form-field appearance="outline">
        <mat-label>Minimum Stock</mat-label>

        <input
          matInput
          type="number"
          formControlName="minimumStock">

      </mat-form-field>
</div>
<div class="col-md-6">
      <mat-form-field appearance="outline">
        <mat-label>Location</mat-label>

        <input
          matInput
          formControlName="location">

      </mat-form-field>
</div>
    </div>


   <mat-form-field appearance="outline">
  <mat-label>Purchase Date</mat-label>

  <input
    matInput
    [matDatepicker]="purchasePicker"
    formControlName="purchaseDate"
    (dateChange)="onPurchaseDateChange($event)">

  <mat-datepicker-toggle
    matSuffix
    [for]="purchasePicker">
  </mat-datepicker-toggle>

  <mat-datepicker #purchasePicker></mat-datepicker>
</mat-form-field>

  </form>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    (click)="cancel()">
    Cancel
  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="update()">
    Update
  </button>

</mat-dialog-actions>
